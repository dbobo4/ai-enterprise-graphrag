services:
  qdrant:
    image: qdrant/qdrant:v1.19
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/seed:/app/data/seed:ro
      - ./data/uploads:/app/data/uploads
      - ./evaluation/questions.json:/app/evaluation/questions.json:ro
    depends_on:
      - qdrant

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  qdrant_data:
